# The Windows app: pushing a tag like v0.45.9 (matching "release" in project.json) builds the installer and
# publishes it as a GitHub Release. Installed apps find it through latest.yml and update themselves.
name: Desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/desktop.mjs --check
      - run: npm install
        working-directory: desktop
      - run: npx electron-builder --win --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
